name: Release

# Push a tag like "v1.3.0" to build and publish the server for every platform it runs on:
# Windows, Linux and macOS, each on x64 and arm64. Every asset is self-contained — the .NET
# runtime is inside it — so a host machine needs nothing installed.
#
# Each platform gets the installer it expects plus an archive:
#
#   Windows   MSI (per-user, no elevation)         + portable zip
#   Linux     .deb, and an AppImage on x64          + tar.gz
#   macOS     .dmg containing an .app bundle        + tar.gz
#
# The archive is the format an Electron host embeds; the installer is for someone putting this
# on their own machine. See RELEASING.md for which is which and why.
#
# What is NOT in the assets: model weights. The embedding model (~90 MB) downloads on first run;
# the generative model (~5 GB) only if Generation is enabled. Every installer here puts the
# program somewhere its owner cannot write, so each one redirects the models directory to the
# user's own data folder — see the launcher scripts under Packaging/.
#
# macOS builds are ad-hoc signed, not Developer ID signed or notarized, so Gatekeeper still
# requires a right-click > Open (or `xattr -cr`) the first time.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release build/upload mid-flight

permissions:
  contents: read # default for every job; only the release job elevates to write

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WIX_VERSION: '7.0.0'

jobs:
  verify-tag:
    # A `v*` tag is just a ref — git doesn't tie it to any branch, so pushing one from a
    # feature branch or develop would trigger this workflow just the same. Gitflow here
    # always tags main (see RELEASING.md), so refuse to build/publish anything if the
    # tagged commit isn't actually reachable from main: catches a tag cut from the wrong
    # branch before it ships instead of after.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history for the ancestry check below, not just the tag commit

      - name: Confirm tag points at a commit on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not reachable from main. Releases must be tagged from main — see RELEASING.md."
            exit 1
          fi

      # The version isn't only stamped on the binaries. AppVersion reads it at runtime and the
      # migrator writes it into the database on every open — CreatedByAppVersion and the
      # migration history are permanent records of which build touched a user's data. A tag
      # that disagrees with the csproj would put a wrong answer in a file we can't go back and
      # correct, so it fails the release rather than being quietly overridden by -p:Version.
      - name: Confirm the checked-in version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CORE="${TAG_VERSION%%-*}"          # v1.3.0-rc.1 -> 1.3.0, so pre-release tags still match
          CSPROJ=agentic-memory/agentic-memory.csproj
          FILE_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$CSPROJ" | head -n1)
          if [ "$FILE_VERSION" != "$CORE" ]; then
            echo "::error::<Version> in $CSPROJ is '$FILE_VERSION' but the tag is '$GITHUB_REF_NAME' (expected '$CORE'). Bump the csproj on main before tagging — see RELEASING.md."
            exit 1
          fi
          echo "Version $FILE_VERSION matches tag $GITHUB_REF_NAME"

  dashboard:
    # Built once, on one machine, and handed to all six publish jobs. wwwroot/ is gitignored, so
    # something has to build it; doing it here rather than six times means every platform ships a
    # byte-identical UI, npm runs once instead of once per runner, and a broken dashboard stops
    # the release at the cheapest possible point. Note the server's own NpmBuild target is
    # ContinueOnError — good for a contributor without Node, useless as a release gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: react-dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: react-dashboard
        run: |
          npm ci
          npm run build

      - name: Confirm the bundle landed in wwwroot
        run: test -f agentic-memory/wwwroot/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          if-no-files-found: error
          path: agentic-memory/wwwroot

  publish:
    needs: [verify-tag, dashboard]
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per target, with the packaging it produces expressed as flags rather than as
          # separate per-OS jobs. Publishing, signing, smoke testing and staging are identical for
          # all six and are worth writing once; only the last few steps differ.
          #
          # `native: true` means the runner can execute what it just built, so the smoke test
          # runs. The two cross-published targets (win-arm64 from x64 Windows, linux-arm64 from
          # x64 Linux) can't be started here; nothing is compiled on the runner for them, the
          # runtime and every native dependency arrive prebuilt from NuGet, so the output is the
          # same as it would be on a native runner — it just goes out unexercised.
          #
          # The Linux runners are pinned older than ubuntu-latest on purpose: the AppImage bundles
          # libicu and libssl copied off the runner, so the runner's glibc becomes the floor for
          # every host that AppImage has to run on. Build on the oldest LTS GitHub still offers.
          # GitHub begins deprecating this image 2026-09-17 (unsupported by 2027-04-17) — move to
          # whatever LTS replaces it before then.
          - { rid: win-x64,     os: windows-latest, archive: zip, native: true,  msi: true, wixArch: x64 }
          - { rid: win-arm64,   os: windows-latest, archive: zip, native: false, msi: true, wixArch: arm64 }
          - { rid: linux-x64,   os: ubuntu-22.04,   archive: tar, native: true,  debArch: amd64, appimage: true }
          - { rid: linux-arm64, os: ubuntu-22.04,   archive: tar, native: false, debArch: arm64 }
          - { rid: osx-arm64,   os: macos-latest,   archive: tar, native: true,  dmg: true }
          - { rid: osx-x64,     os: macos-15-intel, archive: tar, native: true,  dmg: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Compute version and package name
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PKG=agentic-memory-${VERSION}-${{ matrix.rid }}" >> "$GITHUB_ENV"

          # Windows Installer versions are four numeric fields and nothing else, so a pre-release
          # tag has to drop its suffix here: v1.3.0-rc.1 becomes 1.3.0.0. Note that this makes an
          # rc and its final release the same version as far as MajorUpgrade is concerned, so
          # upgrading between them needs the rc uninstalled first. The asset filename keeps the
          # full tag either way.
          echo "MSI_VERSION=${VERSION%%-*}.0" >> "$GITHUB_ENV"

      - name: Fetch the prebuilt dashboard
        uses: actions/download-artifact@v8
        with:
          name: dashboard
          path: agentic-memory/wwwroot

      - name: Publish self-contained ${{ matrix.rid }}
        run: |
          dotnet publish agentic-memory/agentic-memory.csproj -c Release \
            -r ${{ matrix.rid }} --self-contained true \
            -p:Version=${VERSION} -p:SkipDashboardBuild=true \
            -o publish/${{ matrix.rid }}

      - name: Confirm the dashboard made it into the publish output
        run: test -f "publish/${{ matrix.rid }}/wwwroot/index.html"

      - name: Make the launcher executable
        if: runner.os != 'Windows'
        run: chmod +x "publish/${{ matrix.rid }}/agentic-memory"

      - name: Ad-hoc codesign
        if: runner.os == 'macOS'
        run: |
          # Apple Silicon refuses to run ANY unsigned Mach-O code, not just unnotarized code.
          # The SDK ad-hoc signs the apphost itself, but not the loose native libraries a
          # self-contained publish drops beside it — ONNX Runtime, ClearScript's V8 — and an
          # unsigned dylib is killed on load just as an unsigned executable is. Signing every
          # Mach-O found is free and needs no Apple Developer account. It is NOT Developer ID
          # signing or notarization, which we're deliberately skipping: Gatekeeper still shows
          # the "unidentified developer" prompt on both architectures.
          #
          # The .app bundle built further down is signed again as a bundle, which is a different
          # thing from signing the files inside it and does not make this redundant: the tarball
          # ships these same files with no bundle around them.
          find "publish/${{ matrix.rid }}" -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f"
            fi
          done

      # Starts the thing we're about to ship and waits for it to answer. This is the only step
      # that exercises the assembled artifact end to end: the native loads (ONNX Runtime, V8),
      # the embedding model download, the schema migrator creating a database from nothing, and
      # Kestrel actually serving. A green unit-test suite says none of that — it runs against a
      # framework-dependent build with a different layout. /api/admin/health is deliberately
      # exempt from API-key auth, which is what makes it usable as a readiness probe here just
      # as it is for an Electron host.
      - name: Smoke test
        if: matrix.native
        run: |
          set -u
          BIN="publish/${{ matrix.rid }}/agentic-memory"
          [ "$RUNNER_OS" = "Windows" ] && BIN="${BIN}.exe"

          DATA="$RUNNER_TEMP/smoke-data"
          mkdir -p "$DATA"

          "$BIN" --bind 127.0.0.1 --port 45877 --data-dir "$DATA" > smoke.log 2>&1 &
          SERVER_PID=$!

          READY=0
          # Generous, because first run downloads the ~90 MB embedding model before it listens.
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:45877/api/admin/health > /dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::The server exited before it became ready."
              break
            fi
            sleep 2
          done

          # The dashboard is served off disk from the content root, which is a separate thing from
          # the file simply being present in the output — a content root resolved from the wrong
          # place 404s the UI while every API route keeps answering, so health alone would call
          # that build good. Ask for the page itself.
          DASHBOARD=""
          if [ "$READY" = "1" ]; then
            DASHBOARD=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:45877/)
          fi

          # Shut it down, and make sure it is really gone before the next step copies the directory
          # it is running out of. Git Bash's `kill` does not reliably terminate a native Windows
          # process — and `$!` there is an MSYS pid, not the Windows one, so taskkill goes by image
          # name. A survivor holds locks on the publish output, which would make the archive step
          # fail intermittently rather than obviously.
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //IM agentic-memory.exe //F //T > /dev/null 2>&1 || true
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          sleep 2

          echo "--- server output ---"
          cat smoke.log || true

          if [ "$READY" != "1" ]; then
            echo "::error::${{ matrix.rid }} build did not answer /api/admin/health."
            exit 1
          fi
          if [ "$DASHBOARD" != "200" ]; then
            echo "::error::${{ matrix.rid }} build answered health but returned $DASHBOARD for the dashboard at /."
            exit 1
          fi
          echo "${{ matrix.rid }} started, answered health, and served the dashboard."

      # Every asset below is built from this one directory, so they are all the same program by
      # construction rather than by six separate publishes that could drift.
      - name: Stage the package
        run: |
          rm -rf staging && mkdir -p "staging/${PKG}"
          cp -r "publish/${{ matrix.rid }}/." "staging/${PKG}/"

          # The smoke test ran the binary in place and left its downloaded weights behind. A shipped
          # build has no Models directory: weights arrive on first run, wherever the install resolves
          # its models directory to. The asset should be what a fresh publish produces, not what one
          # run of it happened to leave. Same reasoning for anything else written in place; the
          # database cannot appear here, since the smoke test is given its own --data-dir, so that
          # line is a guard against the day it is not.
          rm -rf "staging/${PKG}/Models" "staging/${PKG}/backups"
          find "staging/${PKG}" -maxdepth 1 -name '*.db' -delete

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          mkdir -p dist
          # COPYFILE_DISABLE stops macOS tar writing ._ AppleDouble files into the archive.
          COPYFILE_DISABLE=1 tar -czf "dist/${PKG}.tar.gz" -C staging "${PKG}"

      # The one Windows archive, and it is the portable one. There used to be two — a plain zip and
      # a portable zip differing by a single text file — which is 190 MB of duplication to express
      # a flag. Now that the MSI covers installing, the archive's job is the opposite case: no
      # installer, no registry, nothing left behind, which is what portable.txt actually delivers.
      #
      # AppPaths reads the marker's presence, never its contents. Deleting it turns this back into
      # an ordinary copy that stores data under %LOCALAPPDATA%, and an explicit --data-dir (how a
      # host process is expected to point the sidecar at its own storage) outranks the marker
      # whether it is there or not.
      - name: Archive (portable zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Braces around the variable: a bare $env:PKG-portable reads as one name up to the
          # hyphen today, but the name is the last thing that should be left to parser precedence.
          $portable = "portable/${env:PKG}-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -Path "staging/${env:PKG}/*" -Destination $portable -Recurse

          # Written out even though only its presence is read, because the first thing someone does
          # with an unexplained file in an application folder is open it, and the second is delete it.
          Set-Content -Path "$portable/portable.txt" -Encoding utf8 -Value @(
            'Portable mode.',
            '',
            'While this file exists, Agentic Memory keeps its database, snapshots and logs in the',
            'Data folder beside the executable instead of in your user profile. Delete this file to',
            'go back to the normal per-user location; move the Data folder yourself if you want to',
            'keep what is already stored.'
          )

          Compress-Archive -Path $portable -DestinationPath "dist/${env:PKG}-portable.zip"

      - name: Install WiX
        if: matrix.msi
        run: |
          # install-or-update: `dotnet tool install` fails outright if the runner image ever starts
          # shipping wix, and failing there would burn a tag on something this incidental.
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }} \
            || dotnet tool update --global wix --version ${{ env.WIX_VERSION }}
          wix eula accept wix7
          # -g caches the extension for the user instead of in a .wix folder under the workspace.
          wix extension add -g WixToolset.UI.wixext

      # Per-user, into %LOCALAPPDATA%\Programs — see the long note in Product.wxs for why this is
      # not a Program Files install. The short version: AppPaths puts model weights beside the
      # program and the server downloads ~90 MB of them on first run, so the program directory has
      # to be somewhere its owner can write.
      - name: Build the MSI
        if: matrix.msi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = "dist/${env:PKG}.msi"

          # Harvested from the staged copy rather than from publish/, so the MSI contains exactly
          # what the archive contains — including the smoke test's leftovers having been removed.
          wix build Packaging/windows/Product.wxs `
            -ext WixToolset.UI.wixext `
            -arch ${{ matrix.wixArch }} `
            -d "ProductVersion=${env:MSI_VERSION}" `
            -d "PublishDir=$(Resolve-Path "staging/${env:PKG}")" `
            -d "RepoRoot=$PWD" `
            -out $msi
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed' }

          # `wix build` does not validate in v7 — validation is this separate command, so leaving
          # it out is the default rather than a decision. It catches duplicate component GUIDs,
          # broken conditions and bad sequencing, which are exactly the faults that survive a
          # successful build and surface on a user's machine.
          #
          # The three suppressed ICEs are the standard false positives for a package that is
          # per-user on purpose. ICE38 and ICE64 police per-machine packages that write into a
          # user profile as a side effect, where a repair by a second user finds nothing; ICE91
          # warns that per-user directories do not vary with ALLUSERS. Here the whole product is
          # registered per user, which is what makes all three moot — and satisfying ICE38
          # literally would mean inventing an HKCU key for each of several hundred harvested files.
          wix msi validate -sice ICE38 -sice ICE64 -sice ICE91 $msi
          if ($LASTEXITCODE -ne 0) { throw 'wix msi validate failed' }

          Write-Host "Built $msi ($([math]::Round((Get-Item $msi).Length / 1MB, 1)) MB)"

      # Program in /usr/lib, a wrapper on $PATH, and a systemd user unit that is installed but not
      # enabled. No .desktop entry: this is a server, and an application-menu launcher for
      # something with no window is clutter. The wrapper exists because /usr/lib is root's and the
      # models directory has to land somewhere the user can write — see Packaging/linux/agentic-memory.
      - name: Build the .deb
        if: matrix.debArch
        run: |
          set -e
          ROOT=pkgroot
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/lib/agentic-memory" "$ROOT/usr/bin" "$ROOT/usr/lib/systemd/user"

          cp -r "staging/${PKG}/." "$ROOT/usr/lib/agentic-memory/"
          chmod +x "$ROOT/usr/lib/agentic-memory/agentic-memory"

          install -m 0755 Packaging/linux/agentic-memory "$ROOT/usr/bin/agentic-memory"
          install -m 0644 Packaging/linux/systemd/agentic-memory.service "$ROOT/usr/lib/systemd/user/agentic-memory.service"

          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${{ matrix.debArch }}/" \
            Packaging/linux/debian/control.template > "$ROOT/DEBIAN/control"
          chmod 0755 "$ROOT/DEBIAN"
          chmod 0644 "$ROOT/DEBIAN/control"

          mkdir -p dist
          dpkg-deb --build --root-owner-group "$ROOT" "dist/${PKG}.deb"
          dpkg-deb --info "dist/${PKG}.deb"

      # x64 only. An arm64 AppImage needs a cross-architecture runtime fed to appimagetool, and
      # unlike the cross-published binaries — which come prebuilt from NuGet and are therefore the
      # same bytes a native runner would produce — that packaging step would go out having never
      # been executed anywhere. arm64 gets the .deb and the tarball instead.
      - name: Build the AppImage
        if: matrix.appimage
        run: |
          set -e
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"
          cp -r "staging/${PKG}/." "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/agentic-memory"

          # Bundle libicu/libssl so the AppImage doesn't depend on the host distro having a
          # compatible major version — unlike the .deb, there is no Depends field to pull the
          # right one in. AppRun puts usr/lib on LD_LIBRARY_PATH.
          for lib in libicudata libicuuc libicui18n libssl libcrypto; do
            path=$(ldconfig -p | awk -v n="$lib" '{split($1,a,".so"); if (a[1]==n) print $NF}' | sort -V | tail -n1)
            if [ -n "$path" ]; then
              cp -L "$path" "$APPDIR/usr/lib/"
            else
              echo "::warning::No $lib found on the runner; the AppImage will fall back to the host's copy."
            fi
          done

          install -m 0755 Packaging/linux/appimage/AppRun "$APPDIR/AppRun"
          cp Packaging/linux/appimage/agentic-memory.desktop "$APPDIR/agentic-memory.desktop"
          cp Packaging/icons/agentic-memory-512.png "$APPDIR/agentic-memory.png"

          # appimagetool moved out of AppImageKit into its own repo with real versioned releases;
          # AppImageKit's own "continuous" release is now literally named "obsolete" upstream. Pin
          # a version and verify its published checksum rather than trusting a floating tag.
          APPIMAGETOOL_VERSION=1.9.1
          APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool

          mkdir -p dist
          # --appimage-extract-and-run because the runners have no FUSE for appimagetool to mount
          # itself with.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/${PKG}.AppImage"

      # A .app whose executable is a launcher script: it redirects the models directory out of
      # /Applications, opens the dashboard once the server answers, then execs the server in its
      # own place so quitting the app stops it. See Packaging/macos/AgenticMemory.
      - name: Build the .app and .dmg
        if: matrix.dmg
        run: |
          set -e
          APP="appstage/Agentic Memory.app"
          rm -rf appstage
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp -R "staging/${PKG}/." "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/agentic-memory"
          install -m 0755 Packaging/macos/AgenticMemory "$APP/Contents/MacOS/AgenticMemory"

          sed "s/__VERSION__/${VERSION}/g" Packaging/macos/Info.plist.template > "$APP/Contents/Info.plist"

          # Build the .icns from the largest source PNG at build time, so there is no binary icns
          # committed to the repo; sips and iconutil are stock on macOS runners.
          ICONSET="$(mktemp -d)/agentic-memory.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z $size $size Packaging/icons/agentic-memory-1024.png --out "$ICONSET/icon_${size}x${size}.png" > /dev/null
            sips -z $double $double Packaging/icons/agentic-memory-1024.png --out "$ICONSET/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/agentic-memory.icns"

          # Signing the bundle, having already signed the individual Mach-O files above. --deep so
          # the seal covers the self-contained publish output's loose dylibs, which a top-level
          # signature would leave out.
          codesign --force --deep --sign - "$APP"

          # Plain --verify, not --deep --strict. What is being checked is that the bundle really
          # got signed and its seal is intact, which is the failure worth catching. --strict also
          # enforces where nested code may live, and a self-contained .NET publish puts its dylibs
          # straight in Contents/MacOS rather than Contents/Frameworks — a layout the runtime
          # requires and codesign dislikes, so asking for it would fail the release over something
          # that cannot be changed.
          codesign --verify "$APP"

          DMGROOT=dmgroot
          rm -rf "$DMGROOT"
          mkdir -p "$DMGROOT"
          cp -R "$APP" "$DMGROOT/"
          ln -s /Applications "$DMGROOT/Applications"

          mkdir -p dist
          hdiutil create -volname "Agentic Memory" -srcfolder "$DMGROOT" -ov -format UDZO \
            "dist/${PKG}.dmg"

      - name: Checksum
        run: |
          cd dist
          # Every asset this job produced, whatever its extension. This used to read the single
          # name `ls` returned, which stopped being correct the moment a job emitted an installer
          # as well as an archive.
          shopt -s nullglob
          for asset in *.zip *.tar.gz *.msi *.deb *.AppImage *.dmg; do
            if command -v sha256sum > /dev/null 2>&1; then
              sha256sum "$asset" > "${asset}.sha256"
            else
              shasum -a 256 "$asset" > "${asset}.sha256"
            fi
          done
          cat ./*.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          if-no-files-found: error
          path: dist/*

  release:
    needs: [verify-tag, dashboard, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only this job creates the release / uploads assets
    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: package-*  # not the dashboard artifact, which is an input, not an asset
          merge-multiple: true

      - name: Roll the per-package checksums into one file
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS.txt
          rm -f ./*.sha256
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag with a hyphen is a pre-release by SemVer's own rules (v1.3.0-rc.1), so mark it
          # as one instead of letting it show up as the latest stable release.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $PRERELEASE

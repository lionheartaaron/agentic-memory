name: CI

# Runs the full test suite on every push and pull request, on all three platforms the
# server ships for, and publishes the results as a GitHub check run (pass/fail per test,
# annotations on failures). The React dashboard is built separately — it is part of the
# product but no .NET test touches it.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true # a superseded push/PR shouldn't burn runner time on a stale commit

permissions:
  contents: read # default for every job; the test job adds checks: write to publish results

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    # All three platforms, because "cross platform" is a claim this repository makes in its
    # README and its csproj: everything builds AnyCPU, ClearScript's V8 native is selected per
    # runtime identifier, and AppPaths resolves a different per-user data folder on each OS.
    # Only a matrix actually checks any of that.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            agentic-memory/agentic-memory.csproj
            agentic-memory-tests/agentic-memory-tests.csproj

      - name: Restore
        run: dotnet restore agentic-memory-tests/agentic-memory-tests.csproj

      # SkipDashboardBuild because the test project references the server project, which would
      # otherwise run `npm install && npm run build` here. The dashboard is built and typechecked
      # by its own job below; no test reads wwwroot.
      - name: Build
        run: >
          dotnet build agentic-memory-tests/agentic-memory-tests.csproj
          -c Release --no-restore -p:SkipDashboardBuild=true

      # TestFixture downloads the embedding model (~90 MB, all-MiniLM-L6-v2 from Hugging Face)
      # into the system temp folder the first time it initialises, and throws if that fails — so
      # a Hugging Face outage shows up here as failing memory tests rather than skipped ones.
      # Nothing else in the suite needs the network.
      - name: Test
        run: >
          dotnet test agentic-memory-tests/agentic-memory-tests.csproj
          -c Release --no-build -p:SkipDashboardBuild=true
          --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx"
          --results-directory TestResults

      # Without this, a failing run says "Failed test were found" and nothing else: the reporter
      # below writes its detail to the job summary, and the names and messages are otherwise only
      # in the .trx artifact, which needs repository access to download. That makes a failure on a
      # platform you do not develop on almost unreadable from outside. Printing each failure to the
      # log and raising it as an annotation puts the reason on the run page itself.
      #
      # pwsh rather than bash because it parses XML without a dependency and is present on all
      # three runner images.
      - name: Report failing tests
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            Write-Host 'No .trx file was produced, so the run failed before or during the build.'
            exit 0
          }

          # Workflow commands take the message on one line, and a literal % would be read as the
          # start of an escape.
          function Format-Data([string] $text) {
            if (-not $text) { return '' }
            $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          }

          $workspace = "$env:GITHUB_WORKSPACE".Replace('\', '/').TrimEnd('/')
          $failed = 0

          foreach ($file in $files) {
            $xml = [xml](Get-Content $file.FullName -Raw)

            foreach ($result in @($xml.TestRun.Results.UnitTestResult)) {
              if ($result.outcome -ne 'Failed') { continue }
              $failed++

              $name    = $result.testName
              $message = $result.Output.ErrorInfo.Message
              $stack   = $result.Output.ErrorInfo.StackTrace

              Write-Host ''
              Write-Host "FAILED  $name"
              Write-Host $message
              Write-Host $stack

              # Anchor the annotation on the test's own source line where the stack trace names it,
              # so it is clickable in the diff rather than landing on the workflow file.
              $location = ''
              if ("$stack" -match '(?m) in (.+?):line (\d+)') {
                $path = $Matches[1].Replace('\', '/')
                if ($workspace -and $path.StartsWith($workspace)) {
                  $path = $path.Substring($workspace.Length).TrimStart('/')
                }
                $location = "file=$path,line=$($Matches[2]),"
              }

              $title = (Format-Data $name).Replace(':', '%3A').Replace(',', '%2C')
              Write-Host "::error ${location}title=$title::$(Format-Data "$message`n$stack")"
            }
          }

          Write-Host ''
          Write-Host "$failed failing test(s) across $($files.Count) result file(s)."

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (${{ matrix.os }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          list-suites: all
          list-tests: failed
          fail-on-error: true

      - name: Upload test results (trx)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-trx-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: error

  dashboard:
    # wwwroot/ is gitignored, so the dashboard is compiled from source on every build and there
    # is no checked-in copy to fall back on. The MSBuild target that builds it during a normal
    # `dotnet build` is deliberately ContinueOnError, so a broken dashboard does not stop a
    # contributor working on the server — which means this job is the only thing that catches a
    # type error or a broken bundle before it reaches a release.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: react-dashboard/package-lock.json

      - name: Install
        working-directory: react-dashboard
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck as well as the bundle.
      - name: Build
        working-directory: react-dashboard
        run: npm run build

      - name: Confirm the bundle landed in wwwroot
        run: test -f agentic-memory/wwwroot/index.html
